! SYNTHETIC NORMALIZATION FIXTURE - IOS 15.x - DO NOT DEPLOY
! Adapted from the original test fixture; focused on command patterns recognized in the previous JSON.
! BGP import IN-ISP4 relies on prefix-list ALLOW-IN (no community match).
! Interface Gi0/0 retains EDGE-OUT egress filtering; no EDGE-IN binding.
! NetFlow is used for local flow inspection; no remote exporter configured.
! IPv4 documentation ranges RFC 5737; IPv6 documentation ranges RFC 3849
!
service timestamps debug datetime msec
service timestamps log datetime msec
!
hostname LAB-IOS15-EDGE
!
no aaa new-model
no ip source-route
no ip domain lookup
ip domain name lab.example
ip ssh version 2
ip cef
ipv6 unicast-routing
ipv6 cef
ip multicast-routing
!
username audituser privilege 15 password 0 LAB_ONLY_CHANGE_ME
security passwords min-length 12
!
ip vrf MGMT
 description Management plane VRF
 rd 65000:99
!
archive
 log config
  hidekeys
!
ip flow-cache timeout inactive 60
ip flow-cache timeout active 5
!
interface Loopback0
 description Core router ID, OSPF and iBGP source
 ip address 10.255.0.1 255.255.255.255
 ip ospf 1 area 0
 ip pim sparse-mode
 ipv6 address 2001:DB8:FF::1/128
 ipv6 ospf 1 area 0
!
interface GigabitEthernet0/0
 description CORE-LINK-AREA-0
 ip address 10.0.0.1 255.255.255.252
 ip access-group EDGE-OUT out
 ip flow ingress
 ip flow egress
 no ip proxy-arp
 ip pim sparse-mode
 ip ospf network point-to-point
 ip ospf 1 area 0
 ipv6 address 2001:DB8:0:1::1/64
 ipv6 ospf 1 area 0
 speed auto
 duplex auto
 no cdp enable
 no shutdown
!
interface GigabitEthernet0/1
 description BACKBONE-AREA-1
 ip address 10.0.1.1 255.255.255.252
 ip pim sparse-mode
 ip ospf network point-to-point
 ip ospf 1 area 1
 ipv6 address 2001:DB8:0:2::1/64
 ipv6 ospf 1 area 1
 no shutdown
!
interface GigabitEthernet0/2
 description VLAN-TRUNK
 no ip address
 no ip proxy-arp
 no shutdown
!
interface GigabitEthernet0/2.10
 description USER-VLAN-10
 encapsulation dot1Q 10
 ip address 10.10.10.1 255.255.255.0
 ip pim sparse-mode
 ip ospf 1 area 0
!
interface GigabitEthernet0/2.20
 description GUEST-VLAN-20-STUB-AREA
 encapsulation dot1Q 20
 ip address 10.20.20.1 255.255.255.0
 ip ospf 1 area 2
 ip access-group SHADOW-TEST in
!
interface GigabitEthernet0/3
 description ISP-TRANSIT-IPv4-IPv6
 ip address 198.51.100.2 255.255.255.252
 ipv6 address 2001:DB8:100::2/64
 ip flow ingress
 ip flow egress
 no ip redirects
 no ip proxy-arp
 no cdp enable
 no shutdown
!
interface FastEthernet0/2
 description OUT-OF-BAND-MGMT
 ip vrf forwarding MGMT
 ip address 192.0.2.2 255.255.255.252
 no shutdown
!
interface Tunnel0
 description IP-TUNNEL-TO-REMOTE
 ip address 10.255.10.1 255.255.255.252
 ip tcp adjust-mss 1400
 ip ospf 1 area 0
 ipv6 address 2001:DB8:10::1/64
 ipv6 ospf 1 area 0
 tunnel source Loopback0
 tunnel destination 198.51.100.10
 shutdown
!
interface Ethernet0/0
 description ADMINISTRATIVELY-DISABLED
 no ip address
 shutdown
!
router ospf 1
 router-id 10.255.0.1
 log-adjacency-changes
 passive-interface Loopback0
 redistribute connected subnets
 network 10.0.0.0 0.0.0.3 area 0
 network 10.0.1.0 0.0.0.3 area 1
 network 10.10.10.0 0.0.0.255 area 0
 network 10.20.20.0 0.0.0.255 area 2
 area 2 stub
 area 1 virtual-link 10.255.0.2
 default-information originate always
!
ipv6 router ospf 1
 router-id 10.255.0.1
 redistribute connected
 area 1 virtual-link 10.255.0.2
 default-information originate always
!
router bgp 65000
 bgp router-id 10.255.0.1
 bgp log-neighbor-changes
 bgp deterministic-med
 no bgp default ipv4-unicast
 neighbor IBGP peer-group
 neighbor IBGP remote-as 65000
 neighbor IBGP update-source Loopback0
 neighbor ISP4 peer-group
 neighbor ISP4 remote-as 64500
 neighbor ISP6 peer-group
 neighbor ISP6 remote-as 64500
 neighbor 10.255.0.2 peer-group IBGP
 neighbor 198.51.100.1 peer-group ISP4
 neighbor 2001:DB8:100::1 peer-group ISP6
 !
 address-family ipv4
  bgp additional-paths select all
  bgp additional-paths send receive
  neighbor 10.255.0.2 route-reflector-client
  network 10.10.10.0 mask 255.255.255.0
  network 10.20.20.0 mask 255.255.255.0
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 next-hop-self
  neighbor 198.51.100.1 activate
  neighbor ISP4 send-community
  neighbor ISP4 route-map IN-ISP4 in
  neighbor ISP4 route-map OUT-ISP4 out
 exit-address-family
 !
 address-family ipv4 multicast
  neighbor 198.51.100.1 activate
 exit-address-family
 !
 address-family ipv6
  network 2001:DB8:FF::1/128
  neighbor 2001:DB8:100::1 activate
  neighbor ISP6 send-community both
  neighbor ISP6 route-map IN-ISP6 in
  neighbor ISP6 route-map OUT-ISP6 out
 exit-address-family
!
ip route 10.255.0.2 255.255.255.255 10.0.0.2
ip route 203.0.113.0 255.255.255.0 Null0 250
ip route vrf MGMT 0.0.0.0 0.0.0.0 192.0.2.1
ipv6 route 2001:DB8:AC::/48 Null0 250
!
ip access-list standard MGMT-SOURCES
 permit 192.0.2.0 0.0.0.255
 permit host 198.51.100.20
!
ip access-list standard SNMP-SOURCES
 permit host 192.0.2.20
 permit host 192.0.2.21
!
ip access-list extended EDGE-OUT
 10 deny ip 10.20.20.0 0.0.0.255 any
 20 permit ip any any
!
ip access-list extended SHADOW-TEST
 10 permit ip 10.20.20.0 0.0.0.255 any
 20 deny ip any any
 30 permit icmp any any
!
! Intentional shadow case: SHADOW-TEST sequence 30 cannot be reached.
! In a BGP route-map, extended ACL 101 matches a prefix and its mask.
access-list 101 permit ip host 10.10.10.0 host 255.255.255.0
access-list 101 permit ip host 10.20.20.0 host 255.255.255.0
!
ip prefix-list ALLOW-IN seq 5 permit 0.0.0.0/0 le 24
ip prefix-list ALLOW-OUT seq 5 permit 10.10.10.0/24
ip prefix-list ALLOW-OUT seq 10 permit 10.20.20.0/24
ip prefix-list PREPEND-PRIVATE seq 5 permit 10.10.10.0/24
ipv6 prefix-list ALLOW-V6-IN seq 5 permit ::/0 le 48
ipv6 prefix-list ALLOW-V6-OUT seq 5 permit 2001:DB8:FF::1/128
!
!
route-map IN-ISP4 permit 10
 match ip address prefix-list ALLOW-IN
 set local-preference 350
!
route-map IN-ISP4 deny 999
!
route-map OUT-ISP4 permit 10
 match ip address prefix-list PREPEND-PRIVATE
 set as-path prepend 65000 65000
 set community 65000:100 additive
!
route-map OUT-ISP4 permit 20
 match ip address 101
 set metric 100
 set community 65000:200 additive
!
route-map OUT-ISP4 deny 999
!
route-map IN-ISP6 permit 10
 match ipv6 address prefix-list ALLOW-V6-IN
 set local-preference 200
!
route-map IN-ISP6 deny 999
!
route-map OUT-ISP6 permit 10
 match ipv6 address prefix-list ALLOW-V6-OUT
 set community 65000:300 additive
!
route-map OUT-ISP6 deny 999
!
ip pim bsr-candidate Loopback0 0
ip pim rp-candidate Loopback0
ip pim ssm default
ip msdp peer 198.51.100.1 connect-source Loopback0
!
snmp-server community LAB_READONLY RO SNMP-SOURCES
snmp-server location SYNTHETIC-LAB-EDGE
!
ntp source Loopback0
ntp server 192.0.2.123
logging source-interface Loopback0
logging 192.0.2.10
!
no ip http server
no ip http secure-server
!
line con 0
 logging synchronous
 exec-timeout 5 0
 login local
!
line vty 0 4
 access-class MGMT-SOURCES in
 login local
 transport input ssh
 exec-timeout 10 0
!
line vty 5 15
 access-class MGMT-SOURCES in
 login local
 transport input ssh
 exec-timeout 10 0
!
end
