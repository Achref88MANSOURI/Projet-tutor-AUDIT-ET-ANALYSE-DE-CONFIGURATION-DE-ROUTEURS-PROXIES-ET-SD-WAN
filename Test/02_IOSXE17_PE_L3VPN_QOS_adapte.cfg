! SYNTHETIC NORMALIZATION FIXTURE - Cisco IOS XE 17.x - DO NOT DEPLOY
! Composite from source tests F0371, F0291, F0057, F0059 and F0049
! Adapted from the original test fixture; EVPN and unsupported outbound QoS removed.
! Backbone Gi1/Gi2: IS-IS + MPLS; VRF CUST A/B: OSPF + VPNv4 + QoS voice.
! Gi6: eBGP transit, no orphan WAN-IN ACL or OUT-TRAFFIC policy.
! PKI trustpoints remain declarative, without non-normalized certificate data.
! GigabitEthernet6 requires matching virtual NIC availability.
!
service timestamps debug datetime msec
service timestamps log datetime msec
service call-home
!
hostname LAB-IOSXE17-PE
!
vrf definition CUSTOMER_A
 rd 500:1
 address-family ipv4
  route-target export 100:100
  route-target import 100:100
 exit-address-family
!
vrf definition CUSTOMER_B
 rd 500:2
 address-family ipv4
  route-target export 200:200
  route-target import 200:200
 exit-address-family
!
vrf definition MGMT
 rd 500:99
 address-family ipv4
 exit-address-family
!
aaa new-model
aaa authentication login default local
aaa authorization exec default local
no logging console
ip domain name lab.example
ip ssh version 2
login on-success log
!
username labadmin privilege 15 password 0 LAB_ONLY_CHANGE_ME
!
crypto pki trustpoint SLA-TrustPoint
 enrollment pkcs12
 revocation-check crl
!
crypto pki trustpoint TP-self-signed-3925927892
 enrollment selfsigned
 subject-name cn=IOS-Self-Signed-Certificate-3925927892
 revocation-check none
 rsakeypair TP-self-signed-3925927892
!
!
class-map match-all VOICE
 match dscp ef
!
class-map match-all SIP-CUST-A
 match access-group name SIP
!
class-map match-all SIP
 match dscp cs3
!
class-map match-all VIDEO
 match dscp af41
!
class-map match-all VOIP-CUST-A
 match access-group name VOIP
!
policy-map VOICE-QOS-CUST-A
 class VOIP-CUST-A
  set dscp ef
 class SIP-CUST-A
  set dscp cs3
 class class-default
  set dscp default
!
interface Loopback0
 description PE-ROUTER-ID
 ip address 1.1.1.1 255.255.255.255
 no shutdown
!
interface Loopback1
 description AS-PATH-PREPEND-PRIVATE-TEST
 ip address 10.250.1.1 255.255.255.255
!
interface Loopback2
 description AS-PATH-PREPEND-PUBLIC-TEST
 ip address 10.250.2.2 255.255.255.255
!
interface Loopback3
 description AS-PATH-PASS-THROUGH-TEST
 ip address 10.250.3.3 255.255.255.255
!
interface GigabitEthernet1
 description BACKBONE-TO-P1
 ip unnumbered Loopback0
 ip router isis CORE
 negotiation auto
 mpls ip
 no mop enabled
 no mop sysid
 isis network point-to-point
 no shutdown
!
interface GigabitEthernet2
 description BACKBONE-TO-P2
 ip unnumbered Loopback0
 ip router isis CORE
 negotiation auto
 mpls ip
 no mop enabled
 no mop sysid
 isis network point-to-point
 no shutdown
!
interface GigabitEthernet3
 description CUSTOMER-A-L3VPN-ACCESS
 vrf forwarding CUSTOMER_A
 ip address 10.0.0.2 255.255.255.252
 service-policy input VOICE-QOS-CUST-A
 negotiation auto
 no shutdown
!
interface GigabitEthernet4
 description CUSTOMER-B-L3VPN-ACCESS
 vrf forwarding CUSTOMER_B
 ip address 10.0.0.6 255.255.255.252
 negotiation auto
 no shutdown
!
interface GigabitEthernet6
 description EBGP-TRANSIT-IPv4
 ip address 198.51.100.1 255.255.255.252
 negotiation auto
 no shutdown
!
interface GigabitEthernet7
 description VRF-MGMT-DHCP
 vrf forwarding MGMT
 ip address dhcp
 no shutdown
!
router ospf 1 vrf CUSTOMER_A
 router-id 1.1.1.1
 redistribute bgp 500
 network 10.0.0.0 0.0.0.3 area 0
!
router ospf 2 vrf CUSTOMER_B
 router-id 1.1.1.1
 redistribute bgp 500
 network 10.0.0.4 0.0.0.3 area 0
!
router isis CORE
 net 49.0001.0000.0000.0001.00
 passive-interface Loopback0
!
router bgp 500
 bgp log-neighbor-changes
 neighbor 3.3.3.3 remote-as 500
 neighbor 3.3.3.3 update-source Loopback0
 neighbor 198.51.100.2 remote-as 64510
 !
 address-family vpnv4
  neighbor 3.3.3.3 activate
  neighbor 3.3.3.3 send-community extended
 exit-address-family
 !
 !
 address-family ipv4
  network 10.250.1.1 mask 255.255.255.255
  network 10.250.2.2 mask 255.255.255.255
  network 10.250.3.3 mask 255.255.255.255
  neighbor 198.51.100.2 activate
  neighbor 198.51.100.2 route-map AS-PREPEND-TEST out
 exit-address-family
 !
 address-family ipv4 vrf CUSTOMER_A
  redistribute ospf 1
 exit-address-family
 !
 address-family ipv4 vrf CUSTOMER_B
  redistribute ospf 2
 exit-address-family
!
ip prefix-list PREPEND-PRIVATE seq 5 permit 10.250.1.1/32
ip prefix-list PREPEND-PUBLIC seq 5 permit 10.250.2.2/32
ip prefix-list NO-PREPEND seq 5 permit 10.250.3.3/32
!
route-map AS-PREPEND-TEST permit 10
 match ip address prefix-list PREPEND-PRIVATE
 set as-path prepend 65101 65101
!
route-map AS-PREPEND-TEST permit 20
 match ip address prefix-list PREPEND-PUBLIC
 set as-path prepend 25
!
route-map AS-PREPEND-TEST permit 30
 match ip address prefix-list NO-PREPEND
!
ip access-list extended SIP
 10 permit udp any any eq 5060
 20 permit tcp any any eq 5060
 30 permit tcp any any eq 5061
!
ip access-list extended VOIP
 10 permit udp any any range 16384 32767
!
mpls ldp router-id Loopback0
!
no ip http server
ip http secure-server
ip http authentication local
!
line con 0
 exec-timeout 5 0
 logging synchronous
!
line vty 0 4
 login authentication default
 transport input ssh
 exec-timeout 10 0
!
call-home
 profile "CiscoTAC-1"
  active
  destination transport-method http
!
end
