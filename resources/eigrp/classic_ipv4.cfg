hostname EIGRP-CLASSIC
interface GigabitEthernet0/0
 ip address 192.0.2.1 255.255.255.0
 bandwidth 10000
 delay 100
 ip hello-interval eigrp 100 5
 ip hold-time eigrp 100 15
 ip bandwidth-percent eigrp 100 40
 no ip split-horizon eigrp 100
 ip authentication mode eigrp 100 md5
 ip authentication key-chain eigrp 100 KC
 ip summary-address eigrp 100 192.0.2.0 255.255.255.0 10 leak-map LEAK
interface GigabitEthernet0/1
 vrf forwarding BLUE
 ip hello-interval eigrp 200 10
router eigrp 100
 eigrp router-id 192.0.2.1
 network 192.0.2.0 0.0.0.255
 network 10.0.0.0
 passive-interface default
 no passive-interface GigabitEthernet0/0
 no auto-summary
 eigrp log-neighbor-changes
 eigrp stub connected summary
 variance 2
 maximum-paths 8
 metric maximum-hops 90
 metric weights 0 1 0 1 0 0
 timers active-time 3
 distance eigrp 90 170
 default-metric 10000 100 255 1 1500
 redistribute static metric 1000 10 255 1 1500 route-map IMPORT
 distribute-list prefix PL in GigabitEthernet0/0
 neighbor 192.0.2.2 GigabitEthernet0/0
 address-family ipv4 vrf BLUE
  autonomous-system 200
  network 198.51.100.0 0.0.0.255
  no auto-summary
 exit-address-family
end
