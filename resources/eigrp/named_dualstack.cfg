hostname EIGRP-NAMED
router eigrp CAMPUS
 no shutdown
 address-family ipv4 unicast vrf BLUE autonomous-system 100
  eigrp router-id 192.0.2.100
  network 192.0.2.0 0.0.0.255
  metric weights 0 1 0 1 0 0 1
  eigrp stub receive-only
  af-interface default
   passive-interface
   hello-interval 5
   hold-time 15
   bandwidth-percent 40
   split-horizon
   authentication mode md5
   authentication key-chain KC
  exit-af-interface
  af-interface GigabitEthernet0/0
   no passive-interface
   authentication mode hmac-sha-256 7 __ROUTING_SECRET_PRESENT__
   next-hop-self
   summary-address 192.0.2.0 255.255.255.0 10 leak-map LEAK
  exit-af-interface
  topology base
   no auto-summary
   variance 3
   maximum-paths 8
   metric maximum-hops 80
   timers active-time disabled
   distance eigrp 90 170
   default-metric 1000 10 255 1 1500
   redistribute ospf 10 route-map IMPORT metric 2000 20 255 1 1500
   distribute-list route-map FILTER in
  exit-af-topology
  topology VOICE tid 10
   variance 4
  exit-af-topology
 exit-address-family
 address-family ipv6 unicast autonomous-system 200
  eigrp router-id 192.0.2.200
  shutdown
  af-interface default
   no passive-interface
   authentication key-chain V6_KEYS
  exit-af-interface
  topology base
   variance 2
   redistribute connected
   distribute-list route-map FILTER6 out
  exit-af-topology
 exit-address-family
 address-family ipv4 autonomous-system 300
  network 203.0.113.0
 exit-address-family
end
