hostname EIGRP-V6
interface GigabitEthernet0/0
 ipv6 address 2001:db8::1/64
 ipv6 eigrp 20
 ipv6 hello-interval eigrp 20 10
 ipv6 hold-time eigrp 20 30
 ipv6 bandwidth-percent eigrp 20 50
 no ipv6 split-horizon eigrp 20
 no ipv6 next-hop-self eigrp 20
 ipv6 authentication key-chain eigrp 20 IPV6_KEYS
 ipv6 summary-address eigrp 20 2001:db8::/48 10
interface GigabitEthernet0/1
 ipv6 eigrp 99
ipv6 router eigrp 20
 eigrp router-id 192.0.2.20
 no shutdown
 passive-interface default
 no passive-interface GigabitEthernet0/0
 maximum-paths 4
 variance 2
 redistribute connected
 distribute-list prefix-list V6_PREFIXES in
end
